<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Asistente de voz</title>
<link rel="stylesheet" href="vendor/atom-one-dark.min.css">
<link rel="stylesheet" href="app.css">
<script src="vendor/highlight.min.js"></script>
</head>
<body class="orbe" data-estado="cargando">

  <!-- modo orbe: solo la esfera -->
  <button id="orbe-solo" title="Abrir asistente">
    <div class="orb grande"><i class="onda"></i><i class="onda o2"></i><i class="anillo"></i><i class="nucleo"></i></div>
  </button>

  <!-- modo panel -->
  <div id="panel">
    <header>
      <button id="orb-mini" class="orb mini" title="Escuchar ahora">
        <i class="onda"></i><i class="onda o2"></i><i class="anillo"></i><i class="nucleo"></i>
      </button>
      <div class="titulo">
        <strong>Asistente</strong>
        <span id="estado-texto">Cargando…</span>
      </div>
      <button class="icono" id="btn-nueva" title="Nueva conversación">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button class="icono" id="btn-historial" title="Historial">
        <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg>
      </button>
      <button class="icono" id="btn-cerrar" title="Minimizar a orbe">
        <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
      </button>
    </header>

    <main id="conversacion">
      <div id="bienvenida">
        <div class="orb deco"><i class="anillo"></i><i class="nucleo"></i></div>
        <h1>¿En qué te ayudo?</h1>
        <p>Di <b id="palabra">«asistente»</b> o escribe abajo.<br>
           Puedo revisar tus proyectos, buscar en la web y mostrarte capturas, código y datos.</p>
      </div>
    </main>

    <section id="historial" hidden>
      <div class="hist-cabecera">
        <strong>Historial</strong>
        <button class="icono" id="btn-hist-cerrar" title="Cerrar">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <ul id="hist-lista"></ul>
    </section>

    <footer>
      <button class="icono" id="btn-mic" title="Silenciar micrófono">
        <svg class="mic-on" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        <svg class="mic-off" viewBox="0 0 24 24"><path d="M9 9v2a3 3 0 0 0 5.1 2.1M15 10V6a3 3 0 0 0-5.7-1.3"/><path d="M5 11a7 7 0 0 0 11.5 5.4M19 11a7 7 0 0 1-.6 2.8M12 18v3M3 3l18 18"/></svg>
      </button>
      <form id="form">
        <input id="entrada" autocomplete="off" placeholder="Escribe una pregunta…">
        <button class="icono enviar" title="Enviar">
          <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </form>
      <button class="icono" id="btn-detener" title="Dejar de hablar">
        <svg viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>
      </button>
    </footer>
  </div>

<script src="app.js"></script>
</body>
</html>
